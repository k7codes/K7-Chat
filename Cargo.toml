[package]
name = "rustchat"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[[bin]]
name = "RustChat"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", features = ["clock"] }
eframe = "0.36.2"
jni = "0.22.4"
jni-sys = "0.4.1"
libloading = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
panic = "unwind"
